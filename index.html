<!DOCTYPE html>
<html>
<head>
    <title>Tugas 2 JavaScript</title>
</head>
<body>

    <h2>Data Pegawai</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>Nama Pegawai</th>
                <th>Umur</th>
                <th>Jabatan</th>
                <th>Status</th>
                <th>Gaji Pokok</th>
                <th>Tunjangan Jabatan</th>
                <th>BPJS</th>
                <th>Tunjangan Keluarga</th>
            </tr>
        </thead>

        <tbody id="isi-table">
        </tbody>

        <tfoot>
            <tr>
                <th colspan="7">Total Gaji</th>
                <th id="total-gaji"></th>
            </tr>
        </tfoot>
    </table>

    <script>
        const nama = "Dodi Prayodi";
        const umur = 25;
        const jabatan = "manajer";
        const status = "menikah";

        // Menentukan gaji pokok dengan IF
        let gajiPokok;

        if (jabatan == "manajer") {
            gajiPokok = 15000000;
        } else if (jabatan == "asisten manajer") {
            gajiPokok = 10000000;
        } else if (jabatan == "staff") {
            gajiPokok = 5000000;
        }

        // Tunjangan Jabatan 15%
        const tunjanganJabatan = 15 / 100 * gajiPokok;

        // BPJS 10%
        const bpjs = 10 / 100 * gajiPokok;

        // Tunjangan Keluarga menggunakan Ternary
        const tunjanganKeluarga =
            status == "menikah" ? 20 / 100 * gajiPokok : 0;

        // Total Gaji
        const totalGaji =
            gajiPokok +
            tunjanganJabatan +
            bpjs +
            tunjanganKeluarga;

        // Menampilkan data ke tbody
        document.getElementById("isi-table").innerHTML = `
            <tr>
                <td>${nama}</td>
                <td>${umur}</td>
                <td>${jabatan}</td>
                <td>${status}</td>
                <td>Rp ${gajiPokok.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganJabatan.toLocaleString("id-ID")}</td>
                <td>Rp ${bpjs.toLocaleString("id-ID")}</td>
                <td>Rp ${tunjanganKeluarga.toLocaleString("id-ID")}</td>
            </tr>
        `;

        // Menampilkan total gaji ke tfoot
        document.getElementById("total-gaji").innerHTML =
            `Rp ${totalGaji.toLocaleString("id-ID")}`;
    </script>

</body>
</html>
